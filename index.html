<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>原子習慣</title><style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#23231f;--muted:#77736a;--line:#ded9cf;--accent:#385b49;--soft:#e7eee9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:820px;margin:auto;padding:20px 16px 104px;min-height:100vh}.eyebrow,.sub,.note,small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700}.date{font-size:29px;font-weight:800;margin:5px 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.row,.score,.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{align-items:end}.score strong{font-size:42px}.bar{height:10px;background:#e5e1d8;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--accent);width:0}.page{display:none}.page.on{display:block}.habit,.item,.stat{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #ece8df}.habit:last-child,.item:last-child,.stat:last-child{border:0}.habit input{width:26px;height:26px;accent-color:var(--accent)}.item .info{flex:1}.item b,.habit b{display:block}button{border:0;border-radius:11px;padding:9px 11px;background:var(--soft);color:var(--accent);font:700 14px inherit;touch-action:manipulation}.secondary{background:#f0ede6;color:#555}.danger{background:#f8e5e2;color:#92362e}.actions{display:flex;gap:6px;flex-wrap:wrap}.note{font-size:13px;line-height:1.55}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;color:var(--muted)}.day{min-height:62px;border:1px solid var(--line);border-radius:11px;padding:7px;background:white}.day.today{outline:2px solid var(--accent)}.empty{visibility:hidden}.pct{margin-top:6px;color:var(--accent);font-size:12px;font-weight:800}.zero{color:#aaa}nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 24px));padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border:1px solid var(--line);border-radius:17px;background:#fffdf8f2}nav button{padding:8px 2px;background:transparent;color:var(--muted);font-size:12px}nav button.on{background:var(--soft);color:var(--accent)}dialog{border:0;border-radius:18px;width:min(430px,calc(100% - 24px));padding:0}.modal{padding:20px}input[type=text],textarea,select{width:100%;font:16px inherit;padding:10px;border:1px solid var(--line);border-radius:9px;margin:5px 0 12px}textarea{min-height:65px}.week label{display:inline-block;padding:6px;background:#eee9df;margin:2px;border-radius:7px}.foot{text-align:right;margin-top:10px}@media(max-width:520px){.app{padding:16px 12px 100px}.actions button{padding:8px}.day{min-height:55px}}
</style></head><body><div class="app"><header><div class="eyebrow">ATOMIC HABITS · PERSONAL TRACKER</div><div class="date" id="date"></div></header>
<section id="settings" class="page"><div class="card"><div class="row"><div><h2 style="margin:0">項目設定</h2><p class="note">按「新增到今日」才會放入今天清單；每天可重新挑選。</p></div><div class="actions"><button class="secondary" onclick="edit()">＋ 建立項目</button><button onclick="addAll()">批量新增</button></div></div><div id="items"></div></div></section>
<section id="today" class="page on"><div class="card"><div class="score"><div><div class="sub">今日完成度</div><strong id="tp">0%</strong></div><div class="sub" id="tc">0 / 0</div></div><div class="bar"><i id="tb"></i></div></div><div class="card" id="list"></div><p class="note">修改項目不會影響既有日期的歷史統計。</p></section>
<section id="month" class="page"><div class="card"><div class="calhead"><button onclick="shift(-1)">‹</button><h2 id="mt"></h2><button onclick="shift(1)">›</button></div><div class="cal" id="cal"></div></div><div class="card" id="detail">點選日期查看紀錄。</div></section>
<section id="stats" class="page"><div class="card"><h2>本月統計</h2><div class="score"><div><div class="sub">有紀錄日平均完成度</div><strong id="ap">—</strong></div><div class="sub" id="perfect"></div></div></div><div class="card"><h3>各項目完成率</h3><div id="rates"></div></div></section>
<section id="backup" class="page"><div class="card"><h2>備份與還原</h2><p>把項目設定與每天紀錄匯出成 JSON，可存至「檔案」、iCloud Drive 或 Google Drive。</p><div class="actions"><button onclick="out()">匯出備份</button><button class="secondary" onclick="file.click()">匯入還原</button><input id="file" type="file" accept=".json,application/json" hidden onchange="inn(this.files[0]);this.value=''"></div><p class="note">匯入前會保留目前資料的安全副本，再以備份內容還原。自動雲端備份需要未來由你明確授權雲端帳戶；目前不會自行上傳任何資料。</p></div></section>
<nav><button data-p="settings">☷<br>設定</button><button class="on" data-p="today">✓<br>今日</button><button data-p="month">▦<br>月統計</button><button data-p="stats">◔<br>統計</button><button data-p="backup">⇅<br>備份</button></nav></div>
<dialog id="dlg"><form method="dialog" class="modal"><h2 id="title">建立項目</h2><label>名稱<input id="name" type="text" maxlength="60"></label><label>說明<textarea id="desc" maxlength="140"></textarea></label><label>排程<select id="sch" onchange="week.hidden=this.value!=='weekdays'"><option value="daily">每天</option><option value="weekdays">指定星期</option><option value="once">單次</option></select></label><div id="week" class="week"></div><div class="foot"><button id="cancelBtn" class="secondary">取消</button><button id="saveBtn" onclick="save(event)">儲存</button></div></form></dialog>
<style>
.item{display:block!important;padding:15px 0}.item>.info{display:block;width:100%;margin-bottom:10px}.item>.actions{display:flex;width:100%;padding-left:0}.item>.actions button{flex:1}.habit{width:100%}.habit .info{flex:1;min-width:0}.habit .actions{margin-left:auto;flex-shrink:0}.habit .actions button{padding:7px 9px}
@media(max-width:520px){.item>.actions{gap:5px}.item>.actions button{padding:8px 5px;font-size:12px}.habit{gap:8px}.habit .actions button{font-size:12px;padding:7px 8px}}
</style><script>
const K='atomic:v2',L='atomic:',base=[['wake','09:00–10:00 起床','建立固定開始一天的訊號'],['water','起床喝水','起床後直接完成'],['meal','正常飲食／第一餐','維持飲食節奏'],['work','今日主要工作完成','完成今天最重要的一件事'],['diet','飲食控制','以整天執行情況判斷'],['sleep','00:00–01:00 準備睡覺','建立睡前收尾訊號']];let s;try{s=JSON.parse(localStorage.getItem(K))}catch{};if(!s?.modules)s={version:2,modules:base.map((x,i)=>({id:x[0],name:x[1],desc:x[2],order:i,schedule:{type:'daily'}})),days:{}};s.days??={};const t=new Date(),pad=n=>String(n).padStart(2,'0'),kd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let vm=new Date(t.getFullYear(),t.getMonth(),1),eid=null;date.textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(t);const put=()=>localStorage.setItem(K,JSON.stringify(s)),active=d=>s.modules.filter(x=>x.schedule.type==='daily'||(x.schedule.type==='weekdays'&&x.schedule.days?.includes(d.getDay()))).sort((a,b)=>a.order-b.order),pc=a=>a.length?Math.round(a.filter(x=>x.checked).length/a.length*100):0;
function legacy(d){let x;try{x=JSON.parse(localStorage.getItem(L+kd(d))||'null')}catch{};if(!x)return [];let a=base.map(v=>({id:v[0],name:v[1],desc:v[2],checked:!!x[v[0]]})),tr={1:'胸＋三頭',3:'背＋二頭',5:'肩＋二頭 1 動作＋三頭 1 動作＋核心 1 動作'};a.splice(3,0,d.getDay() in tr?{id:'exercise',name:'完成今日健身',desc:tr[d.getDay()],checked:!!x.exercise}:{id:'activity',name:'今日活動／有氧',desc:'休息日維持基本活動量',checked:!!x.activity});return a}function get(d){return s.days[kd(d)]?.items||legacy(d)}function ensure(d){let k=kd(d);return s.days[k]??={items:[]}}function addToday(x){let a=ensure(t).items;if(a.some(v=>v.id===x.id))return false;a.push({id:x.id,name:x.name,desc:x.desc,checked:false});return true}function addAll(){let n=0;active(t).forEach(x=>{if(addToday(x))n++});put();all();alert(n?'已新增 '+n+' 個項目到今日。':'今日可用項目都已新增。')}
function rt(){let a=ensure(t).items;list.innerHTML=a.length?'':'<p class="note">今天尚未加入項目。請到「設定」逐項新增，或使用「批量新增」。</p>';a.forEach(x=>{let e=document.createElement('div');e.className='habit';e.innerHTML='<input type="checkbox" '+(x.checked?'checked':'')+'><span class="info"><b>'+esc(x.name)+'</b><small>'+esc(x.desc||'')+'</small></span><span class="actions"><button class="danger" type="button">刪除</button></span>';e.querySelector('input').onchange=q=>{x.checked=q.target.checked;put();all()};e.querySelector('button').onclick=()=>{if(confirm('從今天清單刪除「'+x.name+'」？')){let i=a.indexOf(x);if(i>=0)a.splice(i,1);put();all()}};list.append(e)});let p=pc(a);tp.textContent=p+'%';tc.textContent=a.filter(x=>x.checked).length+' / '+a.length;tb.style.width=p+'%';put()}
function rs(){items.innerHTML='';s.modules.sort((a,b)=>a.order-b.order).forEach((x,i)=>{let e=document.createElement('div');e.className='item';let w=x.schedule.type==='daily'?'每天':x.schedule.type==='once'?'單次':(x.schedule.days||[]).map(n=>'日一二三四五六'[n]).join('、'),inToday=ensure(t).items.some(v=>v.id===x.id);e.innerHTML='<div class="info"><b>'+esc(x.name)+'</b><small>'+esc(x.desc||'未填寫說明')+' · '+w+'</small></div><div class="actions"><button '+(inToday?'disabled':'')+'>新增到今日</button><button class="secondary">編輯</button><button class="secondary" '+(!i?'disabled':'')+'>↑</button><button class="secondary" '+(i===s.modules.length-1?'disabled':'')+'>↓</button><button class="danger">刪除</button></div>';let b=e.querySelectorAll('button');b[0].onclick=()=>{if(addToday(x)){put();all();alert('已將「'+x.name+'」新增到今日清單。')}};b[1].onclick=()=>edit(x.id);b[2].onclick=()=>move(x.id,-1);b[3].onclick=()=>move(x.id,1);b[4].onclick=()=>{if(confirm('刪除「'+x.name+'」？歷史紀錄會保留。')){s.modules=s.modules.filter(v=>v!==x);s.modules.forEach((v,n)=>v.order=n);put();all()}};items.append(e)})}
function move(id,n){let a=s.modules.sort((x,y)=>x.order-y.order),i=a.findIndex(x=>x.id===id),j=i+n;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];put();rs()}
function edit(id){eid=id;let x=s.modules.find(v=>v.id===id),N=document.getElementById('name'),D=document.getElementById('desc'),S=document.getElementById('sch'),W=document.getElementById('week'),G=document.getElementById('dlg');title.textContent=x?'編輯項目':'建立項目';N.value=x?.name||'';D.value=x?.desc||'';document.getElementById('cancelBtn').disabled=false;document.getElementById('saveBtn').disabled=false;S.value=x?.schedule.type||'daily';W.hidden=S.value!=='weekdays';W.innerHTML=['日','一','二','三','四','五','六'].map((v,i)=>'<label><input type="checkbox" value="'+i+'" '+(x?.schedule.days?.includes(i)?'checked':'')+'>'+v+'</label>').join('');G.showModal()}function save(e){e.preventDefault();let N=document.getElementById('name'),D=document.getElementById('desc'),S=document.getElementById('sch'),W=document.getElementById('week'),G=document.getElementById('dlg'),n=N.value.trim(),type=S.value,days=[...W.querySelectorAll('input:checked')].map(x=>+x.value);if(!n)return alert('請先填寫項目名稱，才能新增。');if(type==='weekdays'&&!days.length)return alert('請至少選擇一個星期。');let x=s.modules.find(v=>v.id===eid),v={name:n,desc:D.value.trim(),schedule:type==='weekdays'?{type,days}:{type}};if(x)Object.assign(x,v);else{s.modules.push({id:'i'+Date.now(),order:s.modules.length,...v});alert('新增項目成功！');}put();G.close();all()}
function rc(){mt.textContent=vm.getFullYear()+' 年 '+(vm.getMonth()+1)+' 月';cal.innerHTML=['日','一','二','三','四','五','六'].map(x=>'<div class="dow">'+x+'</div>').join('');let f=new Date(vm.getFullYear(),vm.getMonth(),1),z=new Date(vm.getFullYear(),vm.getMonth()+1,0);for(let i=0;i<f.getDay();i++)cal.insertAdjacentHTML('beforeend','<div class="day empty"></div>');for(let n=1;n<=z.getDate();n++){let d=new Date(vm.getFullYear(),vm.getMonth(),n),a=get(d),e=document.createElement('div');e.className='day '+(kd(d)===kd(t)?'today':'');e.innerHTML='<b>'+n+'</b><div class="pct '+(!a.length?'zero':'')+'>'+ (a.length?pc(a)+'%':'—')+'</div>';e.onclick=()=>detail.innerHTML='<h3>'+kd(d)+' · '+(a.length?pc(a)+'%':'尚無紀錄')+'</h3>'+a.map(x=>'<div class="stat"><span>'+esc(x.name)+'</span><b>'+ (x.checked?'✓':'—')+'</b></div>').join('');cal.append(e)}}function shift(n){vm=new Date(vm.getFullYear(),vm.getMonth()+n,1);rc()}
function rstats(){let a=[],c={};for(let n=1;n<=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();n++){let d=get(new Date(t.getFullYear(),t.getMonth(),n));if(d.length)a.push(d)}ap.textContent=a.length?Math.round(a.reduce((z,x)=>z+pc(x),0)/a.length)+'%':'—';perfect.textContent='100%：'+a.filter(x=>pc(x)===100).length+' 天';a.flat().forEach(x=>{let v=c[x.id]??={name:x.name,d:0,n:0};v.n++;if(x.checked)v.d++});rates.innerHTML=Object.values(c).map(x=>'<div class="stat"><span>'+esc(x.name)+'</span><b>'+Math.round(x.d/x.n*100)+'%</b></div>').join('')||'<p class="note">本月尚無紀錄。</p>'}function out(){put();let b=new Blob([JSON.stringify({format:'atomic-habits-backup',version:2,exportedAt:new Date().toISOString(),data:s},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='atomic-habits-'+kd(t)+'.json';a.click()}function inn(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let b=JSON.parse(r.result);if(b.format!=='atomic-habits-backup'||!b.data?.modules||!b.data?.days)throw 0;if(!confirm('以此備份取代目前資料？目前資料會留作安全副本。'))return;localStorage.setItem(K+'.before-import',JSON.stringify(s));s=b.data;put();all();alert('已完成還原。')}catch{alert('無法讀取此備份檔。')}};r.readAsText(f)}function all(){rs();rt();rc();rstats()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on');if(b.dataset.p==='stats')rstats()});all();
</script></body></html>
